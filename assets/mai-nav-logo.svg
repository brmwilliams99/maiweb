<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="64" fill="#0E1E3A"/>
  <g transform="translate(12,12)">
    <!-- face fills (dark bg) -->
    <path d="M20 4 L34 12 L20 20 L6 12 Z"  fill="rgba(255,255,255,0.06)"/>
    <path d="M6 12 L6 28 L20 36 L20 20 Z"   fill="rgba(255,255,255,0.03)"/>
    <path d="M34 12 L34 28 L20 36 L20 20 Z"  fill="rgba(255,255,255,0.05)"/>
    <!-- edges -->
    <path d="M20 4 L34 12 L20 20 L6 12 Z"  stroke="rgba(255,255,255,0.85)" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
    <path d="M6 12 L6 28 L20 36 L20 20 Z"   stroke="rgba(255,255,255,0.85)" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
    <path d="M34 12 L34 28 L20 36 L20 20 Z"  stroke="rgba(255,255,255,0.85)" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
    <!-- vertex dots — all light-blue except bottom-left (rust) -->
    <circle cx="20" cy="4"  r="1.7" fill="#7FB6FF"/>
    <circle cx="34" cy="12" r="1.7" fill="#7FB6FF"/>
    <circle cx="6"  cy="12" r="1.7" fill="#7FB6FF"/>
    <circle cx="20" cy="20" r="1.7" fill="#7FB6FF"/>
    <circle cx="34" cy="28" r="1.7" fill="#7FB6FF"/>
    <circle cx="6"  cy="28" r="1.7" fill="#B84A20"/>
    <circle cx="20" cy="36" r="1.7" fill="#7FB6FF"/>
  </g>
  <!-- wordmark: MASTERS (400 weight) + AI (700 weight), all white, tighter gap to cube -->
  <text y="40" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" fill="rgba(255,255,255,0.92)">
    <tspan x="60" font-size="21" font-weight="400" letter-spacing="3.2">MASTERS</tspan><tspan font-size="21" font-weight="700" letter-spacing="1.2" dx="9">AI</tspan>
  </text>
</svg>
